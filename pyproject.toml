[project]
name = "mcp-russia"
version = "0.5.0"
description = "Русскоязычная адаптация MCP-сервера для публичных и государственных данных"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "mcp-russia contributors" }]
keywords = [
    "mcp",
    "russia",
    "russian",
    "government",
    "api",
    "fastmcp",
    "ai",
    "llm",
    "claude",
    "opendata",
    "opendata",
    "public-data",
    "gosdata",
    "government-data",
    "russian-language",
    "model-context-protocol",
    "agent",
    "async",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp[code-mode]>=3.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
code-mode = ["fastmcp[code-mode]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "diagrams>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_russia"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Russian text naturally contains Cyrillic characters that RUF001/RUF002 flags
"src/mcp_russia/data/rosapi/*" = ["RUF001", "RUF002"]
"src/mcp_russia/data/cbrf/*" = ["RUF001", "RUF002"]
"src/mcp_russia/data/rosstat/*" = ["RUF001", "RUF002"]
"src/mcp_russia/data/gosduma/*" = ["RUF001", "RUF002"]
"src/mcp_russia/data/cekrf/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/agenty/redator/*" = ["RUF001", "RUF002"]
"src/mcp_russia/_shared/*" = ["RUF001", "RUF002"]
"tests/agenty/redator/*" = ["RUF001", "RUF002"]
# Legacy Brazilian modules now have Russian docstrings
"src/mcp_russia/data/brasilapi/*" = ["RUF001", "RUF002"]
"src/mcp_russia/data/ibge/*" = ["RUF001", "RUF002"]
"src/mcp_russia/data/bacen/*" = ["RUF001", "RUF002"]
"src/mcp_russia/data/saude/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/tabua_mares/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/tce_*/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/tse/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/inpe/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/ana/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/anuncios_eleitorais/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/camara/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/compras/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/dados_abertos/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/datajud/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/diario_oficial/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/jurisprudencia/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/senado/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/tcu/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/transparencia/*" = ["RUF001", "RUF002", "E501"]
"src/mcp_russia/data/transferegov/*" = ["RUF001", "RUF002", "E501"]
# New Russian modules with Cyrillic text
"src/mcp_russia/data/zakupki/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/minzdrav/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/kad_arbitrazh/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/rosaudit/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/rosgidromet/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/rosvodresursy/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/publikatsii/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/rospotrebnadzor/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/roskomnadzor/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/fns/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/rosreestr/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/fssp/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/gibdd/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/data/minobrnauki/*" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/mcp_russia/server.py" = ["RUF001", "RUF002"]
"src/mcp_russia/data/__init__.py" = ["RUF001", "RUF002"]
"tests/data/gibdd/*" = ["RUF001", "RUF002"]
"tests/data/minobrnauki/*" = ["RUF001", "RUF002"]
"tests/data/fns/*" = ["RUF001", "RUF002"]
"tests/data/rosgidromet/*" = ["RUF001", "RUF002"]
"tests/data/cbrf/*" = ["RUF001", "RUF002"]
"tests/data/rosstat/*" = ["RUF001", "RUF002"]
"tests/data/zakupki/*" = ["RUF001", "RUF002", "E501"]
"tests/data/minzdrav/*" = ["RUF001", "RUF002", "E501"]
"tests/data/kad_arbitrazh/*" = ["RUF001", "RUF002", "E501"]
"tests/data/rosaudit/*" = ["RUF001", "RUF002", "E501"]
"tests/data/camara/*" = ["RUF001", "RUF002"]
"tests/data/senado/*" = ["RUF001", "RUF002"]
"tests/test_discovery.py" = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# --- Release ---

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = false
tag_format = "v{version}"
build_command = "uv build"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]
