name: Релиз в PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    name: Проверка качества
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Установить Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Установить зависимости
        run: uv sync --group dev

      - name: Линтинг
        run: uv run ruff check src/ tests/ && uv run ruff format --check src/ tests/

      - name: Проверка типов
        run: uv run mypy src/mcp_russia/

      - name: Тесты
        run: uv run pytest -v

  publish:
    name: Публикация в PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Установить Python
        run: uv python install 3.13

      - name: Сборка пакета
        run: uv build

      - name: Дымовое тестирование
        run: |
          uv run --with ./dist/*.whl --no-project -- python -c "import mcp_russia; print(mcp_russia.__version__)"

      - name: Публикация в PyPI
        run: uv publish --trusted-publishing always

  github-release:
    name: Создать релиз на GitHub
    needs: [ci, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установить git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Создать релиз на GitHub
        run: gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
