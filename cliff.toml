# git-cliff — Changelog generator for mcp-russia
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Журнал изменений

Все заметные изменения mcp-russia документированы в этом файле.\n
"""

body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Не выпущено]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.breaking %} [**breaking**]{% endif %}\
    {%- endfor %}
{% endfor %}\n
"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Новые функции" },
    { message = "^fix", group = "Исправления" },
    { message = "^doc", group = "Документация" },
    { message = "^perf", group = "Производительность" },
    { message = "^refactor", group = "Рефакторинг" },
    { message = "^style", group = "Стиль кода" },
    { message = "^test", group = "Тестирование" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Прочее" },
    { message = "^ci", group = "CI/CD" },
    { message = "^build", group = "Сборка" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"
